name: Code Quality & SAST

on:
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - ".editorconfig"
      - ".github/workflows/code-quality.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "src/**"
      - ".editorconfig"
      - ".github/workflows/code-quality.yml"

env:
  DOTNET_VERSION: '10.0.x'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      matrix:
        language: [ 'csharp' ]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          config-file: .github/codeql-config.yml

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: 'src/**/*.csproj'

      - name: Restore dependencies
        run: dotnet restore src/MyProject.slnx

      - name: Build for CodeQL
        run: dotnet build --no-restore src/MyProject.slnx -c Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.9
        with:
          category: "/language:csharp"

  semgrep:
    name: Semgrep Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Run Semgrep Scan (Docker)
        run: |
          docker run --rm \
            -v "$(pwd):/src" \
            returntocorp/semgrep:latest \
            semgrep scan /src/src \
              --config=p/csharp \
              --config=p/owasp-top-ten \
              --config=p/security-audit \
              --config=p/secrets \
              --config=p/cwe-top-25 \
              --exclude='**/Generated/**' \
              --exclude='**/*.Tests/**' \
              --exclude='**/TestResults/**' \
              --exclude='**/bin/**' \
              --exclude='**/obj/**' \
              --sarif --output=/src/semgrep-results.sarif || true

      - name: Upload Semgrep Results
        uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: semgrep-results.sarif
        if: always()

  stylecopanalyzer:
    name: StyleCop Analyzer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: 'src/**/*.csproj'

      - name: Restore dependencies
        run: dotnet restore src/MyProject.slnx

      - name: Build with StyleCop Analysis
        id: stylecop_build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          dotnet build src/MyProject.slnx \
            -c Release \
            -p:EnforceCodeStyleInBuild=true \
            -p:TreatWarningsAsErrors=true \
            -p:ErrorLog=stylecop.sarif \
            -p:ErrorLogVersion=2 \
            --no-restore \
            --verbosity normal 2>&1 | tee build-output.log

      - name: Upload StyleCop SARIF
        if: always() && hashFiles('stylecop.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: stylecop.sarif

      - name: Summarize StyleCop diagnostics
        if: always()
        shell: bash
        run: |
          DIAGNOSTIC_COUNT=$(grep -E -c '\bSA[0-9]{4}\b' build-output.log || true)
          UNIQUE_RULE_COUNT=$( (grep -E -o '\bSA[0-9]{4}\b' build-output.log || true) | sort -u | wc -l | tr -d ' ')

          echo "## StyleCop Analyzer" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.stylecop_build.outcome }}" = "success" ]; then
            echo "- Status: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Status: FAIL" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Diagnostics found: ${DIAGNOSTIC_COUNT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Unique rules triggered: ${UNIQUE_RULE_COUNT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Detailed annotations are available via uploaded SARIF." >> "$GITHUB_STEP_SUMMARY"

      - name: Build StyleCop PR comment body
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        id: stylecop_pr_comment_body
        shell: bash
        run: |
          STATUS_ICON="✅"
          STATUS_TEXT="PASS"
          if [ "${{ steps.stylecop_build.outcome }}" != "success" ]; then
            STATUS_ICON="❌"
            STATUS_TEXT="FAIL"
          fi

          DIAGNOSTIC_COUNT=$(grep -E -c '\bSA[0-9]{4}\b' build-output.log || true)
          TOP_RULES=$( (grep -E -o '\bSA[0-9]{4}\b' build-output.log || true) | sort | uniq -c | sort -nr | head -n 10 | awk '{print "- " $2 ": " $1 " occurrences"}')

          {
            echo 'comment_body<<EOF'
            echo '<!-- stylecop-analysis-report -->'
            echo "## StyleCop Analyzer ${STATUS_ICON} ${STATUS_TEXT}"
            echo
            echo "- Diagnostics found: ${DIAGNOSTIC_COUNT}"
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            if [ -n "$TOP_RULES" ]; then
              echo "### Top Rule Violations"
              echo "$TOP_RULES"
              echo
            fi
            echo "_This comment is automatically updated on each run._"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upsert StyleCop PR comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        env:
          COMMENT_BODY: ${{ steps.stylecop_pr_comment_body.outputs.comment_body }}
        with:
          script: |
            const marker = '<!-- stylecop-analysis-report -->';
            const body = process.env.COMMENT_BODY;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Annotate top StyleCop violations
        if: steps.stylecop_build.outcome == 'failure'
        shell: bash
        run: |
          escape_workflow_data() {
            local value="$1"
            value=${value//'%'/'%25'}
            value=${value//$'\r'/'%0D'}
            value=${value//$'\n'/'%0A'}
            printf '%s' "$value"
          }

          escape_workflow_property() {
            local value
            value=$(escape_workflow_data "$1")
            value=${value//':'/'%3A'}
            value=${value//','/'%2C'}
            printf '%s' "$value"
          }

          set +e
          grep -E '^/.+\.cs\([0-9]+,[0-9]+\): error SA[0-9]{4}:' build-output.log | head -n 50 > stylecop-violations.txt
          while IFS= read -r line; do
            FILE_PATH=$(echo "$line" | sed -E 's#^/home/runner/work/[^/]+/[^/]+/##; s#\(([0-9]+),([0-9]+)\):.*$##')
            LINE_NO=$(echo "$line" | sed -E 's#^.*\(([0-9]+),([0-9]+)\):.*$#\1#')
            COL_NO=$(echo "$line" | sed -E 's#^.*\(([0-9]+),([0-9]+)\):.*$#\2#')
            MESSAGE=$(echo "$line" | sed -E 's#^.*: error (SA[0-9]{4}: .*)$#\1#')
            FILE_PATH_ESCAPED=$(escape_workflow_property "$FILE_PATH")
            MESSAGE_ESCAPED=$(escape_workflow_data "$MESSAGE")
            echo "::error file=${FILE_PATH_ESCAPED},line=${LINE_NO},col=${COL_NO}::${MESSAGE_ESCAPED}"
          done < stylecop-violations.txt

      - name: Enforce StyleCop violations as failure
        if: steps.stylecop_build.outcome == 'failure'
        shell: bash
        run: |
          echo "StyleCop violations detected. Review annotations and build logs."
          exit 1

  code-quality-summary:
    name: Code Quality Summary
    runs-on: ubuntu-latest
    needs: [codeql, semgrep, stylecopanalyzer]
    if: always()
    permissions:
      contents: read

    steps:
      - name: Check Code Quality Status
        run: |
          echo "## Code Quality Analysis Complete"
          echo "✓ CodeQL: SAST vulnerability detection"
          echo "✓ Semgrep: Pattern-based code scanning"
          echo "✓ StyleCop: Code style enforcement"

          if [[ "${{ needs.codeql.result }}" != "success" ]]; then
            echo "❌ CodeQL failed"
            exit 1
          fi

          if [[ "${{ needs.semgrep.result }}" != "success" ]]; then
            echo "❌ Semgrep failed"
            exit 1
          fi

          if [[ "${{ needs.stylecopanalyzer.result }}" != "success" ]]; then
            echo "❌ StyleCop analyzer failed"
            exit 1
          fi

          echo "✅ All code quality checks passed!"
